<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Bağlantı yok · Finans</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: #f8fafc;
        color: #1e293b;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      img {
        width: 4rem;
        height: 4rem;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #64748b;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.5rem;
        background: #0f766e;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>İnternet bağlantısı yok</h1>
      <p>
        Fiyatlar ve hesaplarınız her açılışta sunucudan güncel alınır. Bağlantı gelince yeniden
        deneyin.
      </p>
      <button type="button" onclick="location.reload()">Yeniden dene</button>
    </main>
  </body>
</html>
